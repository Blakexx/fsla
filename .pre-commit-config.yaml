# Lint gates, mirrored exactly by .github/workflows/lint.yml — one tool
# version in both places, pinned, so a hook pass IS a CI pass.
#
#   pip install pre-commit && pre-commit install
#
# Both hooks are CHECKS, not rewriters: a commit that fails formatting is
# refused with the diff named, and the author runs the formatter deliberately.
# csrc/third_party is vendored under a PIN.json digest (setup.py rule R5) and
# is never formatted — the `files` scope below is the enforcement of that.
repos:
  - repo: local
    hooks:
      - id: clang-format-check
        name: clang-format --dry-run (csrc/rola)
        language: python
        additional_dependencies: ["clang-format==19.1.7"]
        entry: clang-format --style=file --dry-run --Werror
        files: ^csrc/rola/.*\.(cu|cuh|cpp|h|hpp)$
      - id: ruff-check
        name: ruff check
        language: python
        additional_dependencies: ["ruff==0.14.10"]
        entry: ruff check --force-exclude
        types_or: [python]
      # THE MANIFEST DESCRIBES THE SOURCES IT SHIPS BESIDE.  `setup.py` asks this
      # too, but only when you BUILD -- and a comment-only last edit goes straight
      # to a commit without one, which is how a manifest ships an edge stale (see
      # tools/manifest_fresh.py).  Hashing the source tree is the whole cost: no
      # compile, no toolchain, no device, so it is affordable on every commit.
      # Scoped to the two directories that can move the answer.
      - id: manifest-freshness
        name: manifests describe csrc/ (no compile)
        language: system
        entry: python3 tools/manifest_fresh.py
        pass_filenames: false
        files: ^(csrc/rola/src/|tools/manifests/)
