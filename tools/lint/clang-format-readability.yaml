# LINT2 (G_FOUNDATION G5 "readability lints", REPORT-ONLY until G5). The
# formatter's half of the readability floor -- `tools/lint/readability_spacing.py`
# is the textual mirror for the same rule (>1 consecutive blank line, csrc
# only -- see that script's module docstring for why Python is excluded).
#
# THIS IS A SEPARATE FILE, NOT AN EDIT TO THE ROOT `.clang-format` --
# DELIBERATELY. Tried first: adding `MaxEmptyLinesToKeep: 1` and
# `SeparateDefinitionBlocks: Always` directly to the root `.clang-format`
# (which the currently-GATING `clang-format-check` pre-commit hook reads).
# Measured: `clang-format --style=file --dry-run --Werror` against the
# amended root config immediately finds diffs on pre-existing files
# (`carry_kernel.cuh`, `entmax.cuh`, `decode.cuh`, ...) that predate
# `SeparateDefinitionBlocks: Always` -- `pre-commit run --all-files` went red
# on the EXISTING gating hook, which directly contradicts this stage's own
# "wired REPORT-ONLY, no hook fails on them yet" and "hooks green" gates. A
# stage that owns ONLY report-only additions cannot edit a file a GATING hook
# already reads without either reformatting the tree (out of scope: "CONFIG
# ONLY: do NOT reformat any source in this stage") or breaking that gate.
#
# This file inherits every other rule from the root `.clang-format` --
# `tools/lint/run_clang_format_readability.sh` invokes clang-format with
# `--style=file:tools/lint/clang-format-readability.yaml` (clang-format's own
# `--style=file:<path>` form, no BasedOnStyle re-declaration needed here since
# `clang-format` merges an explicit style file over nothing -- so this file
# DOES restate the root's full config below via `BasedOnStyle: Google` plus
# the same overrides, since clang-format's file styles do not chain/include
# one another) -- as a REPORT-ONLY diagnostic. G5 flips this by merging these
# two lines into the root file in the SAME commit as the dedicated reformat
# pass that brings the tree into compliance, then deleting this file.
BasedOnStyle: Google
Language: Cpp
Standard: c++17
ColumnLimit: 100
DerivePointerAlignment: false
PointerAlignment: Left
ReferenceAlignment: Left
BreakBeforeBinaryOperators: NonAssignment
ReflowComments: false
SkipMacroDefinitionBody: true
AttributeMacros:
  - __global__
  - __device__
  - __host__
  - __forceinline__
  - __launch_bounds__
SortUsingDeclarations: Never
BreakStringLiterals: false
SortIncludes: Never
MaxEmptyLinesToKeep: 1
SeparateDefinitionBlocks: Always
